name: APK Android

on:
  push:
    branches: [main, android-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Assembler la page et la copier dans l'appli
        run: |
          python3 web/build.py
          mkdir -p app/src/main/assets
          cp web/fusion_conseil.html app/src/main/assets/fusion_conseil.html

      - name: Compiler l'APK
        run: gradle assembleRelease --no-daemon

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk FusionConseil.apk

      - name: Garder l'APK du build
        uses: actions/upload-artifact@v4
        with:
          name: FusionConseil-apk
          path: FusionConseil.apk

      - name: Publier (téléchargeable depuis le téléphone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Fusion Conseil (dernière version)
          body: "Télécharge FusionConseil.apk sur ton téléphone et installe-le (autoriser l'installation d'applis inconnues)."
          files: FusionConseil.apk
          make_latest: true
